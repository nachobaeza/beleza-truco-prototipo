<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- DESIGN §2.2: grano único del sistema. Monocromo, se aplica con mix-blend-mode: overlay
       (3 % sobre --bg-bar, 5 % sobre el paño, 0 % sobre texto, chips y cartas). -->
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="t"/>
    <feColorMatrix in="t" type="saturate" values="0"/>
  </filter>
  <rect width="256" height="256" filter="url(#grain)"/>
</svg>
